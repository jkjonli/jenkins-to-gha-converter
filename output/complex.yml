name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  APP_ENV: ci
jobs:
  checkout-and-build:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - name: Verify jq
        run: jq --version
      - name: Build
        run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-libs
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-results
          path: build/test-results/test/*.xml
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    needs: checkout-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-libs
          path: build/libs
      - name: Unit Tests
        run: ./gradlew --no-daemon test
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: build-test-results
          path: build/test-results/test
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    needs: checkout-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: ./gradlew --no-daemon check
  publish-artifacts:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    needs: [ unit-tests, lint ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Publish Artifacts
        run: echo 'Publishing artifacts (placeholder)'
  post-always:
    name: Post Always
    runs-on: ubuntu-latest
    needs: [ unit-tests, lint, publish-artifacts ]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-libs
          path: build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: archived-libs
          path: build/libs/*.jar
