name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  APP_ENV: ci
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: |
          apk add --no-cache bash git jq
          jq --version
      - name: Build
        run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      - name: Unit Tests
        run: ./gradlew --no-daemon test
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
  lint:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      - name: Lint
        run: ./gradlew --no-daemon check
  publish-artifacts:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    needs: [ unit-tests, lint ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Publish Artifacts
        run: echo 'Publishing artifacts (placeholder)'
  archive:
    runs-on: ubuntu-latest
    needs: [ build, unit-tests, lint, publish-artifacts ]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/libs/*.jar
