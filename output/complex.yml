name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_ENV: ci

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: |
          apk add --no-cache bash git jq
          jq --version
      - name: Build
        run: ./gradlew --no-daemon clean build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      - name: Unit Tests
        run: ./gradlew --no-daemon test
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: apk add --no-cache bash git jq
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      - name: Lint
        run: ./gradlew --no-daemon check

  publish-artifacts:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    if: github.ref == 'refs/heads/main'
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish Artifacts
        run: echo 'Publishing artifacts (placeholder)'

  post-always:
    name: Archive Artifacts
    runs-on: ubuntu-latest
    needs: [build, unit-tests, lint, publish-artifacts]
    if: always()
    container:
      image: gradle:8.7.0-jdk17-alpine
      options: --user root
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/libs/*.jar
